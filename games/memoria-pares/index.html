<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memoria de pares · La granja de Sofi</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <header class="hud">
      <a class="hud__back" href="../../index.html">← Volver</a>
      <h1 class="hud__title">Memoria de pares</h1>
      <div class="hud__stats">
        <div class="hud__stat">
          <span class="hud__stat-value" id="pairs">0 / 0</span>
          <span class="hud__stat-label">Pares</span>
        </div>
        <div class="hud__stat">
          <span class="hud__stat-value" id="time">0s</span>
          <span class="hud__stat-label">Tiempo</span>
        </div>
      </div>
    </header>

    <section class="arena" aria-label="Tablero de memoria">
      <div class="board" id="board" role="grid"></div>

      <div class="overlay" id="startOverlay">
        <div class="overlay__card">
          <h2 class="overlay__title">Memoria de pares</h2>
          <p class="overlay__sub">
            Hacé click en dos cartas para destaparlas.<br>
            Si los animales coinciden, se quedan dadas vuelta.<br>
            Encontrá todos los pares.
          </p>
          <div class="overlay__actions">
            <button class="btn btn--primary" id="startBtn">Empezar</button>
            <a class="btn btn--secondary" href="../../index.html">Volver</a>
          </div>
        </div>
      </div>

      <div class="overlay hidden" id="endOverlay">
        <div class="overlay__card">
          <h2 class="overlay__title">¡Encontraste todos!</h2>
          <p class="overlay__sub">Esto fue lo que hiciste:</p>
          <div class="metrics-grid" id="metricsBox"></div>
          <div class="overlay__actions">
            <button class="btn btn--primary" id="playAgainBtn">Jugar de nuevo</button>
            <a class="btn btn--secondary" href="../../index.html">Volver al corral</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../lib/sounds.js" defer></script>
  <script src="game.js" defer></script>
</body>
</html>
