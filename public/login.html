<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar</title>
  <link rel="stylesheet" href="/styles/base.css">
</head>
<body>
  <div class="app">
    <div class="card">
      <h1>Ingresar</h1>
      <p>Te mandamos un link al mail para entrar.</p>
      <form id="login-form">
        <label for="login-email" class="sr-only">Tu email</label>
        <input
          id="login-email"
          type="email"
          name="email"
          placeholder="tu@email.com"
          required
          autocomplete="email"
          style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;font:inherit;font-size:16px;min-height:44px"
        />
        <div class="advance">
          <button type="submit">Enviar link</button>
        </div>
      </form>
      <p id="status" style="color: var(--text-soft); margin-top: 1rem;"></p>
    </div>
  </div>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
