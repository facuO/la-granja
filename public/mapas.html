<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapas</title>
  <link rel="stylesheet" href="/styles/base.css">
</head>
<body>
  <div class="app">
    <div class="trail">
      <span class="trail-progress">Mapas para consultar</span>
      <div class="trail-nav">
        <a href="javascript:history.back()" class="trail-home">← Volver</a>
        <a href="/sofi.html" class="trail-home">🏠 Inicio</a>
      </div>
    </div>

    <div class="card">
      <h2 class="map-title">Mapa político de Argentina</h2>
      <p class="map-desc">Argentina con todas sus provincias y sus nombres.</p>
      <img
        class="wikimedia-image"
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Argentina%20politico.svg?width=900"
        alt="Mapa político de Argentina con sus provincias"
        loading="lazy"
      />
    </div>

    <div class="card">
      <h2 class="map-title">Mapa de la provincia de Córdoba</h2>
      <p class="map-desc">Tu provincia. Está en el centro de Argentina.</p>
      <img
        class="wikimedia-image"
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Mapas%20escolares%20del%20Instituto%20Geogr%C3%A1fico%20Nacional%20(Argentina)%20-%20Provincia%20de%20C%C3%B3rdoba%20-%20Pol%C3%ADtico%20(2016).jpg?width=900"
        alt="Mapa político escolar de la provincia de Córdoba"
        loading="lazy"
      />
    </div>

    <p class="map-credits">
      Mapas oficiales del Instituto Geográfico Nacional (IGN). Vía Wikimedia Commons.
    </p>
  </div>
</body>
</html>
