<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Aventura del Pollito</title>
  <link rel="stylesheet" href="/styles/base.css">
  <style>
    body.pollito-body { padding: 0; background: linear-gradient(180deg, #b9e4ff 0%, #d8f0ff 70%, #ffeaa6 100%); }
    .pollito-app { padding: 8px; max-width: 100%; }
    .pollito-trail {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 12px; background: rgba(255,255,255,0.85);
      border-radius: 10px; margin-bottom: 8px;
      font-size: 0.9rem; color: var(--text);
    }
    .pollito-trail a { color: var(--text); text-decoration: none; padding: 6px 12px;
      border-radius: 8px; background: white; border: 1px solid var(--border); }
    #game-canvas {
      display: block;
      width: 100%; height: auto;
      aspect-ratio: 8 / 5;            /* mantiene proporción, sin estirar */
      max-height: 70vh;
      background: linear-gradient(180deg, #b9e4ff 0%, #d8f0ff 100%);
      border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      touch-action: none;
      image-rendering: -webkit-optimize-contrast;
    }
    .game-stage {
      position: relative;
      max-width: 1024px; margin: 0 auto;
    }

    .overlay {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55); border-radius: 12px;
      padding: 16px;
    }
    .overlay.shown { display: flex; }
    .overlay-card {
      background: white; padding: 24px; border-radius: 16px;
      text-align: center; max-width: 460px; width: 100%;
    }
    .overlay-card h2 { margin-top: 0; font-size: 1.5rem; }
    .overlay-card p { color: var(--text); margin: 8px 0 16px; }

    .world-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 12px; margin-top: 16px;
    }
    .world-pick {
      background: var(--bg); border: 2px solid var(--border);
      border-radius: 12px; padding: 16px 12px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .world-pick.locked { opacity: 0.5; cursor: not-allowed; }
    .world-pick:not(.locked):hover { border-color: var(--accent-strong); background: white; }
    .world-pick-emoji { font-size: 2.5rem; line-height: 1; }
    .world-pick-name { font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
    .world-pick-status { font-size: 0.85rem; color: var(--text-soft); }
    .world-pick.done .world-pick-status { color: var(--accent-strong); font-weight: 600; }

    .quiz-options {
      display: flex; flex-direction: column; gap: 10px; margin-top: 12px;
    }
    .quiz-opt {
      background: white; color: var(--text);
      border: 2px solid var(--border); border-radius: 10px;
      padding: 14px 16px; font-size: 1.1rem; cursor: pointer; min-height: 48px;
    }
    .quiz-opt:hover { border-color: var(--accent-strong); background: var(--bg); }
    .quiz-feedback {
      margin-top: 12px; font-size: 0.95rem; min-height: 22px;
      color: var(--text-soft);
    }

    /* Controles touch */
    .controls {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
      margin-top: 12px; user-select: none;
      max-width: 600px; margin-left: auto; margin-right: auto;
    }
    .ctrl-btn {
      background: white; border: 2px solid var(--border); border-radius: 14px;
      padding: 18px 0; font-size: 2.2rem; cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active { background: var(--bg); transform: scale(0.96); }
    .hud {
      position: absolute; top: 12px; left: 12px;
      background: rgba(255,255,255,0.9);
      padding: 6px 12px; border-radius: 8px;
      font-weight: 600; font-size: 1.05rem;
      transition: transform 0.05s ease-out;
      transform-origin: left center;
    }
    .hud.bump {
      animation: bumpHud 0.32s ease-out;
    }
    @keyframes bumpHud {
      0%   { transform: scale(1); color: var(--text); }
      40%  { transform: scale(1.22); color: #d6700a; }
      100% { transform: scale(1); color: var(--text); }
    }
    .world-pill {
      position: absolute; top: 12px; right: 60px;
      background: rgba(255,255,255,0.9);
      padding: 6px 12px; border-radius: 8px;
      font-size: 0.95rem;
    }
    .audio-btn {
      position: absolute; top: 12px; right: 12px;
      background: rgba(255,255,255,0.9);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 1.2rem; line-height: 1;
      cursor: pointer; min-height: 38px;
    }
    .audio-btn:hover { border-color: var(--accent-strong); }

    /* Splash de bienvenida */
    .splash-card {
      background: linear-gradient(180deg, #fff7d1 0%, #fff 100%);
      padding: 28px 24px; border-radius: 18px; max-width: 460px; width: 100%;
      text-align: center; border: 3px solid #ffd34a;
      box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    }
    .splash-title {
      font-size: 2rem; font-weight: 700; margin: 0 0 6px;
      color: #5b3a1a; letter-spacing: 0.02em;
    }
    .splash-sub { color: var(--text-soft); margin: 0 0 18px; }
    .splash-pollito {
      display: block; margin: 8px auto 14px;
      width: 120px; height: 120px;
      animation: bounce 1.4s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .splash-start {
      background: #ffd34a; color: #5b3a1a;
      border: 2px solid #f3b620; border-radius: 12px;
      padding: 14px 32px; font-size: 1.3rem; font-weight: 700;
      cursor: pointer; letter-spacing: 0.04em;
    }
    .splash-start:hover { background: #fff; }
    .splash-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-top: 18px;
      padding-top: 14px; border-top: 1px solid var(--border);
    }
    .splash-stat-value { font-size: 1.4rem; font-weight: 700; color: var(--text); }
    .splash-stat-label { font-size: 0.78rem; color: var(--text-soft); text-transform: uppercase; }

    /* Botón pausa + overlay */
    .pause-btn {
      position: absolute; top: 12px; right: 110px;
      background: rgba(255,255,255,0.9);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 1.2rem; line-height: 1;
      cursor: pointer; min-height: 38px;
      display: none;
    }
    .pause-btn.visible { display: block; }
    .pause-btn:hover { border-color: var(--accent-strong); }
  </style>
</head>
<body class="pollito-body">
  <div class="app pollito-app">
    <div class="pollito-trail">
      <span>🐤 Aventura del Pollito</span>
      <div style="display:flex; gap:6px;">
        <a href="/juegos.html">← Juegos</a>
        <a href="/sofi.html">🏠 Inicio</a>
      </div>
    </div>

    <div class="game-stage">
      <canvas id="game-canvas" width="800" height="500" aria-label="Aventura del Pollito"></canvas>
      <div class="hud" id="hud"></div>
      <div class="world-pill" id="world-pill"></div>
      <button class="audio-btn" id="audio-btn" aria-label="Encender música">🔇</button>
      <button class="pause-btn" id="pause-btn" aria-label="Pausar">⏸</button>

      <!-- Splash de bienvenida -->
      <div class="overlay shown" id="splash-overlay">
        <div class="splash-card">
          <canvas class="splash-pollito" id="splash-pollito-canvas" width="120" height="120"></canvas>
          <h1 class="splash-title">Aventura del Pollito</h1>
          <p class="splash-sub">Una aventura por la granja.</p>
          <button class="splash-start" id="splash-start-btn">▶ Empezar</button>
          <div class="splash-stats" id="splash-stats" style="display:none;">
            <div>
              <div class="splash-stat-value" id="stat-worlds">0/4</div>
              <div class="splash-stat-label">Mundos</div>
            </div>
            <div>
              <div class="splash-stat-value" id="stat-eggs">0</div>
              <div class="splash-stat-label">Huevos</div>
            </div>
            <div>
              <div class="splash-stat-value" id="stat-runs">0</div>
              <div class="splash-stat-label">Partidas</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Pausa -->
      <div class="overlay" id="pause-overlay">
        <div class="overlay-card">
          <h2>⏸ Pausa</h2>
          <p>Cuando quieras seguir, tocá Continuar.</p>
          <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
            <button id="resume-btn">▶ Continuar</button>
            <button id="pause-to-select">← Elegir otro mundo</button>
          </div>
        </div>
      </div>

      <!-- Selector de mundos -->
      <div class="overlay" id="select-overlay">
        <div class="overlay-card">
          <h2>🐤 Elegí un mundo</h2>
          <p>Cada mundo tiene su propio desafío.</p>
          <div class="world-grid" id="world-grid"></div>
        </div>
      </div>

      <!-- Quiz overlay (preguntas in-game) -->
      <div class="overlay" id="quiz-overlay">
        <div class="overlay-card">
          <h2 id="quiz-question"></h2>
          <div class="quiz-options" id="quiz-options"></div>
          <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>
      </div>

      <!-- Victoria de mundo -->
      <div class="overlay" id="win-overlay">
        <div class="overlay-card">
          <h2 id="win-title">🎉 ¡Mundo completado!</h2>
          <p id="win-msg">Lo lograste, Sofi.</p>
          <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
            <button id="restart-btn">Jugar otra vez</button>
            <button id="back-to-select">← Elegir otro mundo</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btn-left" aria-label="Izquierda">◀</button>
      <button class="ctrl-btn" id="btn-jump" aria-label="Saltar">⤴</button>
      <button class="ctrl-btn" id="btn-right" aria-label="Derecha">▶</button>
    </div>
  </div>

  <script type="module" src="/js/juego-pollito.js"></script>
</body>
</html>
